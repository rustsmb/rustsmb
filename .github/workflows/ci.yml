name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install protobuf compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-targets

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Install protobuf compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install protobuf compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace

  integration-test:
    name: Integration Tests (smbclient)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install protobuf compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler
      - uses: Swatinem/rust-cache@v2
      - name: Install smbclient
        run: |
          sudo apt-get update
          sudo apt-get install -y smbclient
      - name: Run smbclient integration tests
        run: cargo test --test integration_smbclient -- --ignored

  smbtorture-test:
    name: SMB Spec Tests (smbtorture)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build smbtorture Docker image
        run: docker build -f tests/Dockerfile.smbtorture -t rustsmb-smbtorture .
      - name: Run smbtorture tests
        run: docker run --rm rustsmb-smbtorture all

  python-smb-test:
    name: Python SMB Tests (smbprotocol)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install protobuf compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler
      - uses: Swatinem/rust-cache@v2
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Python dependencies
        run: pip install -r tests/python/requirements.txt
      - name: Build and start server
        run: |
          cargo build --release
          ./target/release/rustsmb --listen 127.0.0.1:4450 &
          sleep 3
      - name: Run Python tests
        env:
          RUSTSMB_SERVER: 127.0.0.1
          RUSTSMB_PORT: 4450
          RUSTSMB_SHARE: test
          RUSTSMB_USER: testuser
          RUSTSMB_PASSWORD: testpass
        run: cd tests/python && pytest -v --tb=short

  ha-test:
    name: HA Integration Tests (Redis)
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install protobuf compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler
      - uses: Swatinem/rust-cache@v2
      - name: Install smbclient
        run: |
          sudo apt-get update
          sudo apt-get install -y smbclient
      - name: Run HA integration tests with Redis
        env:
          RUSTSMB_REDIS_URL: redis://127.0.0.1:6379
          RUSTSMB_HA_TEST_BACKEND: redis
        run: cargo test --test integration_ha -- --ignored

  # Build Linux server binary for Windows integration tests
  build-linux-server:
    name: Build Linux Server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install protobuf compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler
      - uses: Swatinem/rust-cache@v2
      - name: Build release binary
        run: cargo build --release --package rustsmb
      - name: Upload server binary
        uses: actions/upload-artifact@v4
        with:
          name: rustsmb-linux
          path: target/release/rustsmb
          retention-days: 1

  integration-test-windows:
    name: Integration Tests (Windows → WSL2)
    runs-on: windows-latest
    needs: build-linux-server
    steps:
      - uses: actions/checkout@v4

      # Download pre-built Linux server binary
      - name: Download Linux server binary
        uses: actions/download-artifact@v4
        with:
          name: rustsmb-linux
          path: linux-bin

      # Setup WSL2 with Ubuntu
      - name: Enable WSL2
        run: |
          wsl --install --no-launch
          wsl --set-default-version 2

      - name: Install Ubuntu in WSL2
        run: |
          wsl --install -d Ubuntu --no-launch
          wsl -d Ubuntu -- echo "WSL2 Ubuntu ready"

      - name: Start SMB server in WSL2
        shell: pwsh
        run: |
          # Convert Windows path to WSL path (D:\a\repo\repo -> /mnt/d/a/repo/repo)
          $winPath = '${{ github.workspace }}'
          $wslPath = '/mnt/' + $winPath.Substring(0,1).ToLower() + $winPath.Substring(2).Replace('\', '/')
          echo "WSL workspace path: $wslPath"

          # Make binary executable and copy to WSL
          wsl -d Ubuntu -- chmod +x $wslPath/linux-bin/rustsmb

          # Get WSL2 IP address
          $wslIp = (wsl -d Ubuntu -- hostname -I).Trim().Split()[0]
          echo "WSL2 IP: $wslIp"

          # Start server in background on port 445
          Start-Process -NoNewWindow wsl -ArgumentList "-d", "Ubuntu", "--", "bash", "-c", "cd $wslPath && RUST_LOG=info ./linux-bin/rustsmb --listen 0.0.0.0:445 2>&1 | tee /tmp/smb-server.log"

          # Wait for server to start
          Start-Sleep -Seconds 3

          # Setup port forwarding from Windows localhost:445 to WSL2:445
          netsh interface portproxy add v4tov4 listenport=445 listenaddress=127.0.0.1 connectport=445 connectaddress=$wslIp
          netsh interface portproxy show all

          # Test connectivity
          Test-NetConnection -ComputerName 127.0.0.1 -Port 445

      # Setup Windows Rust for client tests
      - uses: dtolnay/rust-toolchain@stable
      - name: Install protobuf compiler (Windows)
        run: choco install protoc -y
      - uses: Swatinem/rust-cache@v2

      - name: Run Windows client tests against WSL2 server
        env:
          RUSTSMB_TEST_MODE: external
        run: cargo test --test integration_windows -- --ignored

      - name: Show server logs on failure
        if: failure()
        run: wsl -d Ubuntu -- cat /tmp/smb-server.log

  doc:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install protobuf compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -Dwarnings

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install protobuf compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-llvm-cov
      - run: cargo llvm-cov --workspace --lcov --output-path lcov.info
      - uses: codecov/codecov-action@v3
        with:
          files: lcov.info
          fail_ci_if_error: false
