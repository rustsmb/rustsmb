name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-targets

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace

  integration-test:
    name: Integration Tests (smbclient)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install smbclient
        run: |
          sudo apt-get update
          sudo apt-get install -y smbclient
      - name: Run smbclient integration tests
        run: cargo test --test integration_smbclient -- --ignored

  integration-test-windows:
    name: Integration Tests (Windows → WSL2)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # Setup WSL2 with Ubuntu
      - name: Enable WSL2
        run: |
          wsl --install --no-launch
          wsl --set-default-version 2

      - name: Install Ubuntu in WSL2
        run: |
          wsl --install -d Ubuntu --no-launch
          wsl -d Ubuntu -- echo "WSL2 Ubuntu ready"

      - name: Install Rust in WSL2
        run: |
          wsl -d Ubuntu -- bash -c "curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y"
          wsl -d Ubuntu -- bash -c 'source $HOME/.cargo/env && rustc --version'

      - name: Build server in WSL2
        run: wsl -d Ubuntu -- bash -c 'source $HOME/.cargo/env && cd /mnt/c/Users/runneradmin/work/rustsmb/rustsmb && cargo build --release --package rustsmb-server'

      - name: Start SMB server in WSL2
        shell: pwsh
        run: |
          # Get WSL2 IP address
          $wslIp = (wsl -d Ubuntu -- hostname -I).Trim().Split()[0]
          echo "WSL2 IP: $wslIp"

          # Start server in background on port 445
          Start-Process -NoNewWindow wsl -ArgumentList "-d", "Ubuntu", "--", "bash", "-c", "source `$HOME/.cargo/env && cd /mnt/c/Users/runneradmin/work/rustsmb/rustsmb && RUST_LOG=info ./target/release/rustsmb --listen 0.0.0.0:445 2>&1 | tee /tmp/smb-server.log"

          # Wait for server to start
          Start-Sleep -Seconds 5

          # Setup port forwarding from Windows localhost:445 to WSL2:445
          netsh interface portproxy add v4tov4 listenport=445 listenaddress=127.0.0.1 connectport=445 connectaddress=$wslIp
          netsh interface portproxy show all

          # Test connectivity
          Test-NetConnection -ComputerName 127.0.0.1 -Port 445

      # Setup Windows Rust for client tests
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Run Windows client tests against WSL2 server
        env:
          RUSTSMB_TEST_MODE: external
        run: cargo test --test integration_windows -- --ignored

      - name: Show server logs on failure
        if: failure()
        run: wsl -d Ubuntu -- cat /tmp/smb-server.log

  doc:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -Dwarnings

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-llvm-cov
      - run: cargo llvm-cov --workspace --lcov --output-path lcov.info
      - uses: codecov/codecov-action@v3
        with:
          files: lcov.info
          fail_ci_if_error: false
