description = "Local filesystem backend for RustSMB"

[dependencies]
rustsmb-core = { workspace = true }
rustsmb-vfs = { workspace = true }
tokio = { workspace = true, features = ["fs", "sync"] }
futures = { workspace = true }
nix = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
tempfile = { workspace = true }
