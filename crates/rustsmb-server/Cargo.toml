[package]
name = "rustsmb-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "SMB2/SMB3 server implementation for RustSMB"

[dependencies]
rustsmb-core = { workspace = true }
rustsmb-protocol = { workspace = true }
rustsmb-vfs = { workspace = true }
rustsmb-state = { workspace = true }
rustsmb-auth = { workspace = true }
rustsmb-session = { workspace = true }
tokio = { workspace = true, features = ["net", "io-util", "sync", "time"] }
futures = { workspace = true }
tracing = { workspace = true }
bytes = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
rustsmb-state-memory = { workspace = true }
rustsmb-backend-memory = { workspace = true }
