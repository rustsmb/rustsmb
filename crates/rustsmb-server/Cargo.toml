[package]
name = "rustsmb-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "SMB2/SMB3 server implementation for RustSMB"

[dependencies]
rustsmb-core = { workspace = true }
rustsmb-protocol = { workspace = true }
rustsmb-vfs = { workspace = true }
rustsmb-state = { workspace = true }
rustsmb-auth = { workspace = true }
rustsmb-session = { workspace = true }
rustsmb-state-cached = { workspace = true }
rustsmb-coord-raft = { workspace = true }
rustsmb-coordinator-client = { workspace = true }
tokio = { workspace = true, features = ["net", "io-util", "sync", "time", "signal"] }
tokio-rustls = "0.26"
rustls = "0.23"
rustls-pemfile = "2.1"
futures = { workspace = true }
tokio-stream = { workspace = true }
tracing = { workspace = true }
bytes = { workspace = true }
binrw = { workspace = true }
serde = { workspace = true }
toml = { workspace = true }
rand = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
rustsmb-state-memory = { workspace = true }
rustsmb-backend-memory = { workspace = true }
